name: safe_json_mapper
description: A robust reflection-free JSON mapper for Flutter and Dart. Handles type drift, missing fields, and nested models safely using code generation.
version: 0.0.5
homepage: https://github.com/greelogix/safe_json_mapper
repository: https://github.com/greelogix/safe_json_mapper
issue_tracker: https://github.com/greelogix/safe_json_mapper/issues
topics:
  - json
  - mapper
  - serialization
  - safe-json
  - code-generation

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  meta: ^1.17.0
  build: ^4.0.3
  source_gen: ^4.1.1
  analyzer: ^9.0.0

dev_dependencies:
  build_runner: ^2.10.4
  test: ^1.29.0
  flutter_lints: ^6.0.0

# The package is a pure Dart package, ensuring universal support for:
# Android, iOS, Web, macOS, Windows, Linux, and Dart VM.

# (No flutter.plugin key needed for pure Dart logic packages)

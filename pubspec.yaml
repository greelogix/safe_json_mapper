name: safe_json_mapper
description: A robust reflection-free JSON mapper for Flutter and Dart. Handles type drift, missing fields, and nested models safely using code generation.
version: 0.1.3
homepage: https://github.com/greelogix/safe_json_mapper
repository: https://github.com/greelogix/safe_json_mapper
issue_tracker: https://github.com/greelogix/safe_json_mapper/issues
topics:
  - json
  - mapper
  - serialization
  - safe-json
  - code-generation

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  build: ^4.0.11
  source_gen: ^4.3.0
  analyzer: ^14.5.0

dev_dependencies:
  build_runner: ^2.16.2
  test: ^1.33.0
  lints: ^6.1.0

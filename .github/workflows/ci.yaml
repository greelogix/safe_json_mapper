name: Package verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test example/safe_json_mapper_example.dart example/safe_json_mapper_example.g.dart
      - run: dart analyze lib test example/safe_json_mapper_example.dart
      - run: dart test
      - run: dart run example/safe_json_mapper_example.dart
      - run: flutter pub get
        working-directory: example
      - run: dart run build_runner build
        working-directory: example
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: dart pub publish --dry-run
      - run: dart pub global activate pana 0.23.19
      - run: dart pub global run pana --exit-code-threshold 0 .
